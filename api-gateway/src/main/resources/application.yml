server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # ---------- AUTH SERVICE (public: register/login handled inside service) ----------
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # ---------- USER SERVICE ----------
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        # ---------- JOB SERVICE ----------
        - id: job-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/jobs/**

        # ---------- APPLICATION SERVICE ----------
        - id: application-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/applications/**

# JWT secret must be IDENTICAL across gateway + auth-service (used to sign/verify tokens)
jwt:
  secret: JobOrbitSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456
  expiration-ms: 86400000

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.joborbit.gateway: DEBUG
